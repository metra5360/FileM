<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Передача файлів між пристроями</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
 
  <header class="topbar">
    <h1>📡 Файли між пристроями</h1>
    <p class="subtitle">Пряма передача P2P — без хмари. Ніяких кодів — просто скануй QR</p>
  </header>
 
  <main class="grid">
 
    <section class="card">
      <h2>1. З'єднання</h2>
      <canvas id="qrCanvas"></canvas>
      <p class="hint" id="statusText">Ініціалізація…</p>
 
      <button class="btn primary" id="scanBtn">📷 Сканувати QR іншого пристрою</button>
 
      <div class="scanner hidden" id="scannerBox">
        <video id="video" playsinline muted></video>
        <button class="btn small" id="cancelScanBtn">Скасувати сканування</button>
      </div>
    </section>
 
    <section class="card">
      <h2>2. Файли</h2>
 
      <label class="dropzone" id="dropzone">
        <input type="file" id="fileInput" multiple hidden>
        <span>Натисни, щоб обрати фото / файли для надсилання</span>
      </label>
      <ul class="file-list" id="pickedFiles">
        <li class="placeholder">Файли ще не вибрано</li>
      </ul>
 
      <h3>Отримані файли</h3>
      <ul class="file-list" id="incomingFiles">
        <li class="placeholder">Тут з'являться файли від іншого пристрою</li>
      </ul>
    </section>
 
  </main>
 
  <footer>
    <div class="log" id="log"></div>
  </footer>
 
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <script src="script.js"></script>
</body>
</html>
